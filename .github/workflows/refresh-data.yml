name: Refresh product data

on:
  schedule:
    - cron: '17 3 * * 1'  # Mondays at 03:17 UTC
  workflow_dispatch:
    inputs:
      max_pages:
        description: Category pages to read per product type
        default: '50'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements-pipeline.txt

      - name: Run pipeline
        run: python -m pipeline.run --max-pages ${{ github.event.inputs.max_pages || '50' }}

      - name: Run tests on the new data
        run: pytest -q

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skincare_products.csv data/quality_report.md
          git diff --cached --quiet || git commit -m "Refresh product data $(date -u +%Y-%m-%d)"
          git push

      - name: Keep the quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: data/quality_report.md
